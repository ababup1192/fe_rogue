[package]
name        = "flix_engine_core"
description = "Foundational types and utilities for flix_game_engine (math, color, asset/render type aliases, font/audio data utilities, project.json loader)"
version     = "0.1.0"
flix        = "0.73.0"
authors     = ["ababup1192 <ababup1192@gmail.com>"]
repository  = "github:ababup1192/flix_engine_core"

# engine_core は Flix stdlib と軽量な pure Flix ライブラリ (flix-json) だけに
# 依存する基盤層。LWJGL / OpenGL / GLFW などのネイティブランタイム依存は持たない。
# それらは render_core が担当する。

[dependencies]
"github:mlutze/flix-json" = "0.13.2"
