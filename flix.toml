[package]
name        = "flix_game_engine_monorepo"
description = "Repository-root package for the Flix community build. Inlines engine_core sources via ./src symlinks so `flix build` works at the repo root."
version     = "0.1.0"
flix        = "0.73.0"
authors     = ["ababup1192 <ababup1192@gmail.com>"]

# community-build はリポジトリルートで `flix build` する。ルートに単一パッケージを置き、
# 依存ゼロの土台 engine_core のソースを ./src へ相対 symlink で同梱する (make sync-root)。
# engine_core は Flix 標準ライブラリのみに依存し、mvn / native / github 依存を持たないため
# 外部ダウンロード無しで最速・確実にグリーンになる。
# 既存のモノレポ構成 (engine_core/ render_core/ engine/ ide/ examples/) と make sync は無変更。
[dependencies]
