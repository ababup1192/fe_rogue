name: community-build root drift guard

# community-build はリポジトリルートで `flix build` する。ルートの単一パッケージは
# ./src を symlink で同梱した engine ライブラリ3層 (engine_core + render_core + engine) の
# ソースを、src/Main.flix の window 構築ダミーアプリでコンパイルする。
# いずれかの src にファイルが増減したのに ./src を再生成し忘れると、
# regression ビルドから黙ってファイルが漏れる/壊れる。
# このガードは `make sync-root` を実行し、./src に差分が出たら fail させることで
# ./src が常に 3層の src と一致していることを保証する。
# (Makefile と同じ生成ロジックを使うので、ガードとターゲットが食い違うことはない。
#  src/Main.flix は実ファイルで sync-root が温存するため差分には出ない。)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sync-root-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate ./src and fail on drift
        run: |
          make sync-root
          CHANGES="$(git status --porcelain -- src)"
          if [ -n "$CHANGES" ]; then
            echo "::error::./src is out of sync with the engine library sources. Run 'make sync-root' and commit the result."
            echo "--- drift (git status --porcelain -- src) ---"
            echo "$CHANGES"
            git diff -- src || true
            exit 1
          fi
          echo "./src is in sync ($(find src -type l -name '*.flix' | wc -l | tr -d ' ') symlinks + Main.flix)."
