[package]
name        = "flix_engine_world"
description = "Author-facing game framework on flix_game_engine: the App run-loop (consumes the GameEngine contract, backend-agnostic), an immutable-World ECS (EntityId, Query combinators, Collision broadphase, Physics2D), Camera rigs, a pure UI toolkit (flex layout, widget store, spec/binding, menus, extract), and frontend services (asset/resource loading, save/persistence, JSON, logging)"
version     = "0.7.1"
flix        = "0.75.1"
authors     = ["ababup1192 <ababup1192@gmail.com>"]
repository  = "github:ababup1192/flix_engine_world"

# flix_game_engine（契約層）の上に載る「作家向けフレームワーク」。App ループが契約を
# バックエンド非依存に消費し、不変 World の ECS（query / collision / physics）・Camera・
# UI toolkit・frontend サービス（Resource/Save/JSON/Logger）でゲームを組む道具を提供する。
# 契約の純粋パーツ（GameEngine・シーングラフ・土台型）を再利用するため flix_game_engine に依存する。

[dependencies]
"github:ababup1192/flix_engine_core" = { version = "0.7.1", security = "unrestricted" }
