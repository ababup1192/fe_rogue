<script>
function fsWire(el){
  var frames=parseInt(el.getAttribute('data-frames'),10);
  var dw=parseFloat(el.getAttribute('data-dw'));
  var name=el.getAttribute('data-name');
  var fps=parseInt(el.getAttribute('data-fps'),10);
  var view=el.querySelector('.fs-view');
  var range=el.querySelector('.fs-range');
  var addr=el.querySelector('.fs-addr');
  var i=0,timer=null;
  function show(n){i=((n%frames)+frames)%frames;
    view.style.backgroundPosition=(-i*dw)+'px 0';range.value=i;addr.textContent=name+'#'+i;}
  function stop(){if(timer){clearInterval(timer);timer=null;el.classList.remove('playing');}}
  function play(){if(timer){stop();return;}el.classList.add('playing');
    timer=setInterval(function(){show(i+1);},Math.max(1,Math.round(1000/fps)));}
  el.querySelector('.fs-prev').onclick=function(){stop();show(i-1);};
  el.querySelector('.fs-next').onclick=function(){stop();show(i+1);};
  el.querySelector('.fs-play').onclick=play;
  range.oninput=function(){stop();show(parseInt(range.value,10));};
  addr.onclick=function(){fsCopy(name+'#'+i);};
  show(0);
}
function fsCopy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).catch(function(){fsFallbackCopy(t);});}
  else{fsFallbackCopy(t);}
}
function fsFallbackCopy(t){
  var ta=document.createElement('textarea');ta.value=t;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}
document.addEventListener('DOMContentLoaded',function(){
  var els=document.querySelectorAll('.filmstrip');
  for(var k=0;k<els.length;k++){fsWire(els[k]);}
});
</script>
