<style>body{background:#1a1f2b;color:#cdd5e6;font-family:sans-serif;margin:16px}

img{display:block;image-rendering:pixelated;width:100%;height:auto;background:#000}

.scenario-name{font-size:14px;font-weight:700;color:#ffd479}

p.tag-index{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}

span.lint.warn{color:#ffce6b;background:#3a2a08}
span.lint.sup{color:#8c99ad;background:#1a2332}
details.lint-detail{align-self:flex-start}details.lint-detail summary{cursor:pointer;list-style:none}
