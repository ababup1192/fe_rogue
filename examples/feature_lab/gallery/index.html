<!doctype html><meta charset="utf-8"><title>feature_lab Gallery</title>
<style>body{background:#1a1f2b;color:#cdd5e6;font-family:sans-serif;margin:16px}
a{color:#9cc0ff}h1{font-size:18px}
p.hint{font-size:12px;color:#8c99ad;margin:0 0 16px}
p.hint.missing{margin:6px 0 0}
nav.crumbs{font-size:13px;margin-bottom:8px;display:flex;gap:14px;flex-wrap:wrap}
main{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
figure{margin:0;background:#0d1220;border:1px solid #2a3445;border-radius:6px;padding:8px}
figcaption{margin-bottom:6px;display:flex;flex-direction:column;gap:3px}
figcaption code{font-size:14px;font-weight:700;color:#ffd479;background:#241c07;
  padding:2px 6px;border-radius:4px;align-self:flex-start;cursor:pointer;
  font-family:ui-monospace,Menlo,Consolas,monospace}
figcaption .desc{font-size:12px;color:#9cc0ff}
.tags{font-size:11px;color:#6f7d94;display:flex;gap:6px;flex-wrap:wrap}
a.tag{color:#6f7d94;text-decoration:none}a.tag:hover{color:#9cc0ff;text-decoration:underline}
a.scenario-link{font-size:11px;color:#6f7d94;align-self:flex-start}
img{display:block;image-rendering:pixelated;width:100%;height:auto;background:#000}
.placeholder{display:flex;align-items:center;justify-content:center;height:80px;
  color:#6f7d94;font-size:12px;background:#000;border:1px dashed #2a3445}
a.scenario{display:block;text-decoration:none;background:#0d1220;border:1px solid #2a3445;
  border-radius:6px;padding:8px}
a.scenario:hover{border-color:#4a6fb0}
.scenario-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.scenario-name{font-size:14px;font-weight:700;color:#ffd479}
.count{font-size:12px;color:#8c99ad;background:#1a2332;border-radius:10px;padding:1px 8px}
a.scenario .desc{display:block;font-size:12px;color:#9cc0ff;margin-top:6px}
h2.section{font-size:13px;color:#8c99ad;margin:18px 0 8px;text-transform:uppercase;
  letter-spacing:.04em;border-bottom:1px solid #2a3445;padding-bottom:4px}
h2.section:first-of-type{margin-top:4px}
p.tag-index{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
span.lint{font-size:11px;border-radius:4px;padding:1px 6px;align-self:flex-start}
span.lint.ok{color:#7bd88f;background:#123020}
span.lint.warn{color:#ffce6b;background:#3a2a08}
span.lint.sup{color:#8c99ad;background:#1a2332}
details.lint-detail{align-self:flex-start}details.lint-detail summary{cursor:pointer;list-style:none}
details.lint-detail ul{margin:4px 0 0;padding-left:16px;font-size:11px;color:#c9a24a}
details.lint-detail li{margin:2px 0}
figure:target{border-color:#ffd479}
.filmstrip{display:flex;flex-direction:column;gap:6px}
.fs-view{background:#000;background-repeat:no-repeat;image-rendering:pixelated;
  border:1px solid #2a3445;border-radius:4px}
.fs-canvas{display:block;background:#000;image-rendering:pixelated;
  border:1px solid #2a3445;border-radius:4px}
.fs-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fs-ctl button{background:#1a2332;color:#cdd5e6;border:1px solid #2a3445;border-radius:4px;
  cursor:pointer;font-size:12px;line-height:1;padding:3px 7px}
.fs-ctl button:hover{border-color:#4a6fb0}
.fs-range{flex:1;min-width:80px;accent-color:#4a6fb0;cursor:pointer}
code.fs-addr{font-size:12px;font-weight:700;color:#ffd479;background:#241c07;
  padding:2px 6px;border-radius:4px;cursor:pointer;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.filmstrip.playing .fs-play{border-color:#7bd88f;color:#7bd88f}</style>
<h1>feature_lab Gallery</h1>
<p class="hint">One page per game feature. Open a card to browse its basic states, edge cases and flows. The yellow code tag on each page is the snapshot name (report bugs by it; click to copy).</p>
