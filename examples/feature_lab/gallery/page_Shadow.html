<h1>Shadow</h1>
<p class="hint">The yellow code tag is the snapshot name (report bugs by it); click to copy. Tags link to their cross-feature pages.</p>
<h2 class="section">Basic states</h2>
<main>
  <figure id="shadow_light_front" style="width:320px"><figcaption><code onclick="navigator.clipboard&&navigator.clipboard.writeText('shadow_light_front')" title="click to copy the name">shadow_light_front</code><span class="desc">光が壁の手前: 壁の裏の目印（白丸）が影に沈んで見えない（Shadow.itemsFor の Multiply 黒 Poly）</span></figcaption><img src="shadow_light_front.png" alt="shadow_light_front"></figure>
  <figure id="shadow_light_behind" style="width:320px"><figcaption><code onclick="navigator.clipboard&&navigator.clipboard.writeText('shadow_light_behind')" title="click to copy the name">shadow_light_behind</code><span class="desc">光が壁の向こう側へ回り込むと同じ目印が照らされて見える（壁と遮蔽ポリゴンは同じ定義から導出）</span></figcaption><img src="shadow_light_behind.png" alt="shadow_light_behind"></figure>
  <figure id="shadow_walls_off" style="width:320px"><figcaption><code onclick="navigator.clipboard&&navigator.clipboard.writeText('shadow_walls_off')" title="click to copy the name">shadow_walls_off</code><span class="desc">対照カット: shadow_light_front と同じ光位置で walls=false。目印が沈まず見える＝暗さは壁の影であって距離減衰ではない</span></figcaption><img src="shadow_walls_off.png" alt="shadow_walls_off"></figure>
  <figure id="lightmap_two_lanterns" style="width:320px"><figcaption><code onclick="navigator.clipboard&&navigator.clipboard.writeText('lightmap_two_lanterns')" title="click to copy the name">lightmap_two_lanterns</code><span class="desc">光マップ方式: ランタン 2 個が同時に照らし、同じ壁から 2 方向へ影が伸びる（Light.lightMapPass + lightMapOverlay。暗幕方式では不可能な絵）</span></figcaption><img src="lightmap_two_lanterns.png" alt="lightmap_two_lanterns"></figure>
  <figure id="lightmap_swing" style="width:320px"><figcaption><code onclick="navigator.clipboard&&navigator.clipboard.writeText('lightmap_swing')" title="click to copy the name">lightmap_swing</code><span class="desc">ランタン A が壁の反対側へ回った連番: 同じ壁の影が別の向きへ倒れる（影が光の位置から導かれている証拠）。A の長い影が B の灯りまで消しているのは v1 の割り切りどおり（Light.lightMapPass の doc 参照）</span></figcaption><img src="lightmap_swing.png" alt="lightmap_swing"></figure>

</main>

<h2 class="section">Flows</h2>
<main>
  <figure id="lightmap_orbit" style="width:320px"><figcaption><code onclick="navigator.clipboard&&navigator.clipboard.writeText('lightmap_orbit')" title="click to copy the name">lightmap_orbit</code><span class="desc">光マップ方式の動き: ランタン A が L 字壁の周りを一周し、同じ壁の影が全方向へ回る。B は据え置き（Light.lightMapPass をコマごとに焼く bakeGifWithPasses の手本）</span></figcaption><div class="filmstrip" data-name="lightmap_orbit" data-frames="8" data-dir="frames/lightmap_orbit/" data-dw="320" data-fps="10" style="width:320px"><canvas class="fs-canvas" width="640" height="480" style="width:320px;height:240px"></canvas><div class="fs-ctl"><button class="fs-play" title="再生 / 停止">⏯</button><button class="fs-prev" title="前のコマ">◀</button><input class="fs-range" type="range" min="0" max="7" value="0"><button class="fs-next" title="次のコマ">▶</button><code class="fs-addr" title="クリックで name#N をコピー">lightmap_orbit#0</code></div></div></figure>
  <figure id="shadow_walk" style="width:320px"><figcaption><code onclick="navigator.clipboard&&navigator.clipboard.writeText('shadow_walk')" title="click to copy the name">shadow_walk</code><span class="desc">光が L 字壁と柱の周りを一周し、壁の陰が動的に回る（LeftCtrl で walls トグル相当）</span></figcaption><div class="filmstrip" data-name="shadow_walk" data-frames="8" data-dir="frames/shadow_walk/" data-dw="320" data-fps="10" style="width:320px"><canvas class="fs-canvas" width="640" height="480" style="width:320px;height:240px"></canvas><div class="fs-ctl"><button class="fs-play" title="再生 / 停止">⏯</button><button class="fs-prev" title="前のコマ">◀</button><input class="fs-range" type="range" min="0" max="7" value="0"><button class="fs-next" title="次のコマ">▶</button><code class="fs-addr" title="クリックで name#N をコピー">shadow_walk#0</code></div></div></figure>

</main>

<script>
function fsWire(el){
  var frames=parseInt(el.getAttribute('data-frames'),10);
  var dw=parseFloat(el.getAttribute('data-dw'));
  var name=el.getAttribute('data-name');
  var fps=parseInt(el.getAttribute('data-fps'),10);
  var dir=el.getAttribute('data-dir');
  var view=el.querySelector('.fs-view');
  var canvas=el.querySelector('.fs-canvas');
  var range=el.querySelector('.fs-range');
  var addr=el.querySelector('.fs-addr');
  var i=0,timer=null,ctx=null,imgs=null;
  if(dir){ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;imgs=new Array(frames);}
  function frameAt(n){var im=imgs[n];
    if(!im){im=new Image();im.src=dir+n+'.png';imgs[n]=im;}return im;}
  function show(n){i=((n%frames)+frames)%frames;
    if(dir){var im=frameAt(i),want=i;
      if(im.complete&&im.naturalWidth>0){ctx.drawImage(im,0,0);}
      else{im.onload=function(){if(i===want){ctx.drawImage(im,0,0);}};}}
    else{view.style.backgroundPosition=(-i*dw)+'px 0';}
    range.value=i;addr.textContent=name+'#'+i;}
  function stop(){if(timer){clearInterval(timer);timer=null;el.classList.remove('playing');}}
  function play(){if(timer){stop();return;}el.classList.add('playing');
    timer=setInterval(function(){show(i+1);},Math.max(1,Math.round(1000/fps)));}
  el.querySelector('.fs-prev').onclick=function(){stop();show(i-1);};
  el.querySelector('.fs-next').onclick=function(){stop();show(i+1);};
  el.querySelector('.fs-play').onclick=play;
  range.oninput=function(){stop();show(parseInt(range.value,10));};
  addr.onclick=function(){fsCopy(name+'#'+i);};
  show(0);play();
}
function fsCopy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).catch(function(){fsFallbackCopy(t);});}
  else{fsFallbackCopy(t);}
}
function fsFallbackCopy(t){
  var ta=document.createElement('textarea');ta.value=t;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}
document.addEventListener('DOMContentLoaded',function(){
  var els=document.querySelectorAll('.filmstrip');
  for(var k=0;k<els.length;k++){fsWire(els[k]);}
});
</script>
